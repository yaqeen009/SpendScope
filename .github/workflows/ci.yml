name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The workflow provides every value the application needs. `.env` is never
  # committed and is not required here (dotenv does not override the environment).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendscope?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendscope_test?schema=public
  CORS_ORIGIN: http://localhost:5173
  LOG_LEVEL: warn

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendscope
        ports:
          - 5432:5432
        # Without a health check the first step can race the database.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d spendscope \
            -c 'CREATE DATABASE spendscope_test;'

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Apply migrations to the development-shaped database
        run: npm run db:deploy

      - name: Apply migrations to the test database
        run: npm run db:test:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        # The API suite runs against the real PostgreSQL service above.
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Starts the API and the Vite dev server itself (see playwright.config.ts).
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
