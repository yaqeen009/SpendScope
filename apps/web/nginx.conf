# nginx configuration for the SpendScope single-page app.
#
# The SPA and the API are served from one origin, so the session cookie is
# same-site and no CORS configuration is needed in the browser's path. `/api`
# is proxied to the API service by its compose service name.

upstream spendscope_api {
  server api:4000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never advertise the nginx version.
  server_tokens off;

  # Baseline browser protections, repeated inside the locations below because a
  # local `add_header` cancels inherited ones.
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable; index.html must never be cached, or a
  # deploy leaves browsers running an old bundle against a new API.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    proxy_pass http://spendscope_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API is configured with TRUST_PROXY=1, so this header is what makes
    # rate limiting see the real client address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A CSV upload can be several megabytes and parsing takes a moment.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 12m;
  }

  # Client-side routing: any other path is a route in the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
